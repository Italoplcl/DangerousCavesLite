name: DangerousCaves
version: '${version}'
main: dev.caveslite.CavesLite
api-version: '26.1'
description: Ambient cave sounds and custom mobs (lite port of Dangerous Caves 2)
authors: [imDaniX, Evil-Lootlye]
commands:
  dangerouscaves:
    aliases: [dcaves]
    description: Manage Dangerous Caves mobs
    usage: /<command> <list|summon|kill|reload>
    permission: dangerouscaves.command
permissions:
  dangerouscaves.command:
    description: Use /dcaves
    default: op
